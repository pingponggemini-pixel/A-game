<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maple RPG</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loginScreen">
    <h1>Maple RPG</h1>
    <input id="username" placeholder="輸入角色名稱">
    <button onclick="login()">開始冒險</button>
</div>

<div id="gameScreen" style="display:none">

    <h2 id="playerName"></h2>

    <div class="stats">
        <p>等級：<span id="level"></span></p>
        <p>HP：<span id="hp"></span></p>
        <p>MP：<span id="mp"></span></p>
        <p>攻擊：<span id="atk"></span></p>
        <p>金幣：<span id="gold"></span></p>
    </div>

    <hr>

    <h3>地圖</h3>

    <button onclick="fight('菇菇寶貝')">
        菇菇森林
    </button>

    <button onclick="fight('綠水靈')">
        綠水靈森林
    </button>
    
    <button onclick="fight('藍寶王')">
    Boss 藍寶王
    </button>

    <button onclick="gacha()">
        裝備轉蛋
    </button>

    <button onclick="skillAttack()">
    🔥 火焰斬擊
    </button>

    <div id="log"></div>

</div>

<script src="js/game.js"></script>
</body>
</html>
<hr>

<h3>背包</h3>

<div id="inventory"></div>

<button onclick="saveGame()">
存檔
</button>

<button onclick="loadGame()">
讀檔
</button>

<h3>商店</h3>

<button onclick="buyPotion()">
買藥水(10金)
</button>
