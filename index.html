<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maple RPG - 模組化第二版</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="loginScreen">
        <h1>🍁 Maple RPG 🍁</h1>
        <p>歡迎回來，James 的冒險世界</p>
        <input id="username" placeholder="輸入你的角色名稱" value="James">
        <button onclick="login()">開始冒險</button>
    </div>

    <div id="gameScreen" style="display:none;">
        <div class="stats-bar">
            <span id="playerName">冒險者</span>
            <span>Lv. <span id="level">1</span></span>
            <span>HP: <span id="hp">100/100</span></span>
            <span>ATK: <span id="atk">10</span></span>
            <span>金幣: <span id="gold">0</span></span>
        </div>

        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <div class="touch-controls">
            <div class="d-pad">
                <div class="touch-btn" id="btnLeft">◀</div>
                <div class="touch-btn" id="btnRight">▶</div>
            </div>
            <div class="action-pad">
                <div class="touch-btn" id="btnAttack" style="background: rgba(200,0,0,0.6);">攻擊</div>
                <div class="touch-btn" id="btnJump" style="background: rgba(0,0,200,0.6);">跳躍</div>
            </div>
        </div>

        <div style="margin: 10px;">
            <button onclick="saveGame()">💾 存檔</button>
            <button onclick="loadGame()">📂 讀檔</button>
            <button onclick="gacha()">🎁 轉蛋 (20金)</button>
        </div>
        <div id="log"></div>
    </div>

     <script src="js/ui.js"></script>
    <script src="js/player.js"></script>
    <script src="js/monster.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
