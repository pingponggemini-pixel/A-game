<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maple RPG - 第一版</title>
    <style>
        /* 基礎樣式設計 */
        body {
            background: #f0f8ff;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        /* 登入區塊 */
        #loginScreen {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: inline-block;
            margin-top: 50px;
        }

        #username {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 200px;
        }

        /* 按鈕樣式 */
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 14px;
            cursor: pointer;
            background-color: #ff9900;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #e68a00;
        }

        /* 狀態欄 */
        .stats {
            display: flex;
            justify-content: center;
            gap: 25px;
            font-size: 18px;
            font-weight: bold;
            background: #e6f2ff;
            padding: 15px;
            border-radius: 8px;
            max-width: 600px;
            margin: 20px auto;
        }

        /* 遊戲日誌（戰鬥過程） */
        #log {
            margin: 20px auto;
            border: 2px solid #ccc;
            height: 250px;
            width: 80%;
            max-width: 600px;
            overflow-y: auto;
            background: #fafafa;
            padding: 15px;
            text-align: left;
            font-family: monospace;
            line-height: 1.5;
            border-radius: 5px;
        }

        /* 背包區塊 */
        #inventory {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        #inventory div {
            padding: 10px;
            border: 2px dashed #ff9900;
            border-radius: 5px;
            background: white;
            min-width: 100px;
        }

        #inventory button {
            padding: 3px 10px;
            font-size: 12px;
            background-color: #555;
        }
    </style>
</head>
<body>

    <div id="loginScreen">
        <h1>🍁 Maple RPG 🍁</h1>
        <p>歡迎來到冒險者的起點</p>
        <input id="username" placeholder="輸入你的角色名稱">
        <button onclick="login()">開始冒險</button>
    </div>

    <div id="gameScreen" style="display:none">
        <h2 id="playerName"></h2>

        <div class="stats">
            <div>等級: <span id="level">1</span></div>
            <div>HP: <span id="hp">100 / 100</span></div>
            <div>攻擊: <span id="atk">10</span></div>
            <div>金幣: <span id="gold">0</span></div>
        </div>
        
        <button style="background-color: #4CAF50;" onclick="saveGame()">💾 存檔</button>
        <button style="background-color: #2196F3;" onclick="loadGame()">📂 讀檔</button>

        <hr style="width: 80%; border: 1px solid #ddd; margin: 20px auto;">

        <h3>🗺️ 冒險地圖與轉蛋</h3>
        <button onclick="fight('菇菇寶貝')">🍄 菇菇森林 (Lv.1)</button>
        <button onclick="fight('綠水靈')">💧 綠水靈森林 (Lv.3)</button>
        <button onclick="fight('藍寶王')">👑 藍寶王巢穴 (BOSS)</button>
        <button style="background-color: #9c27b0;" onclick="gacha()">🎁 裝備轉蛋 (20金幣)</button>

        <div id="log">【系統】請選擇目的地開始冒險...</div>

        <hr style="width: 80%; border: 1px solid #ddd; margin: 20px auto;">

        <h3>🎒 冒險者背包</h3>
        <div id="inventory">
            <p style="color: #aaa;">背包空空如也...</p>
        </div>
    </div>

    <script>
        // 玩家初始資料
        let player = {
            name: "",
            level: 1,
            hp: 100,
            maxHp: 100,
            baseAttack: 10,
            gold: 0,
            exp: 0,
            inventory: [],
            weapon: null
        };

        // 怪物資料庫
        const monsters = {
            "菇菇寶貝": { hp: 30, attack: 5, exp: 10, gold: 5 },
            "綠水靈": { hp: 50, attack: 8, exp: 20, gold: 10 },
            "藍寶王": { hp: 300, attack: 25, exp: 100, gold: 100 }
        };

        // 登入邏輯
        function login() {
            const usernameInput = document.getElementById("username").value.trim();
            if(!usernameInput) {
                alert("請輸入角色名稱！");
                return;
            }

            player.name = usernameInput;
            
            // 切換畫面顯示
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("gameScreen").style.display = "block";
            
            addLog(`【系統】冒險者 <b>${player.name}</b> 踏入了弓手村...`);
            updateUI();
        }

        // 更新畫面上的數據
        function updateUI() {
            player.hp = Math.max(0, player.hp);

            document.getElementById("playerName").innerHTML = "🍁 冒險者： " + player.name;
            document.getElementById("level").innerText = player.level;
            document.getElementById("hp").innerText = player.hp + " / " + player.maxHp;
            document.getElementById("atk").innerText = getAttack(); 
            document.getElementById("gold").innerText = player.gold;
        }

        // 新增日誌訊息
        function addLog(text) {
            const logDiv = document.getElementById("log");
            logDiv.innerHTML += text + "<br>";
            logDiv.scrollTop = logDiv.scrollHeight; // 自動滾動到底部
        }

        // 計算總攻擊力（基礎攻擊 + 武器攻擊）
        function getAttack() {
            let atk = player.baseAttack;
            if(player.weapon) {
                atk += player.weapon.attack;
            }
            return atk;
        }

        // 存檔機制
        function saveGame() {
            localStorage.setItem("mapleSaveData", JSON.stringify(player));
            addLog("<span style='color: green;'>【系統】存檔成功！資料已儲存至瀏覽器。</span>");
        }

        // 讀檔機制
        function loadGame() {
            const savedData = localStorage.getItem("mapleSaveData");
            if (savedData) {
                player = JSON.parse(savedData);
                
                // 成功讀檔後直接跳過登入畫面
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("gameScreen").style.display = "block";
                
                // 刷新全部畫面
                updateUI();
                updateInventory();
                
                // 清空舊日誌並通知
                document.getElementById("log").innerHTML = "";
                addLog(`【系統】讀檔成功！歡迎回來，偉大的 Lv.${player.level} 冒險者 ${player.name}！`);
            } else {
                alert("找不到任何存檔紀錄！");
            }
        }

        // 戰鬥系統
        function fight(name) {
            // 深拷貝怪物數據，防止血量被扣死
            let monster = JSON.parse(JSON.stringify(monsters[name]));
            let currentAtk = getAttack();

            addLog(`<br><span style='color: blue;'><b>⚔️ 開始與 ${name} 戰鬥！</b></span>`);

            while(player.hp > 0 && monster.hp > 0) {
                // 玩家出招
                monster.hp -= currentAtk;
                addLog(`你對 ${name} 施展普通攻擊，造成 <span style='color: red;'>${currentAtk}</span> 點傷害。`);

                if(monster.hp <= 0) {
                    addLog(`🎉 擊敗了 ${name}！`);
                    addLog(`獲得金幣 +${monster.gold}，經驗值 +${monster.exp}`);
                    
                    player.gold += monster.gold;
                    player.exp += monster.exp;
                    
                    levelCheck();
                    updateUI();
                    return;
                }

                // 怪物反擊
                player.hp -= monster.attack;
                addLog(`${name} 發動反擊，使你受到了 <span style='color: brown;'>${monster.attack}</span> 點傷害。`);

                if(player.hp <= 0) {
                    addLog("<span style='color: grey;'>☠️ 你被打倒了... 被強制傳回村莊安全區（HP已補滿）。</span>");
                    player.hp = player.maxHp; // 復活機制
                    updateUI();
                    return;
                }
            }
            updateUI();
        }

        // 經驗值與升級檢查
        function levelCheck() {
            let needExp = player.level * 50; // 每升一級，下一級需要的經驗會變多
            if(player.exp >= needExp) {
                player.exp -= needExp;
                player.level++;
                player.maxHp += 20;
                player.hp = player.maxHp; // 升級補滿血
                player.baseAttack += 5;

                addLog(`<span style='color: #ff6600; font-size: 16px;'><b>🌟 LEVEL UP！！目前等級達到 Lv.${player.level}！</b></span>`);
            }
        }

        // 轉蛋抽卡系統
        function gacha() {
            if(player.gold < 20) {
                addLog("<span style='color: red;'>【轉蛋】金幣不足！需要 20 金幣才能抽一次。</span>");
                return;
            }

            player.gold -= 20;
            let r = Math.random();
            let item;

            if(r < 0.55) {
                item = { name: "新手木劍", attack: 2 };
            } else if(r < 0.85) {
                item = { name: "鋼鐵合金劍", attack: 6 };
            } else if(r < 0.98) {
                item = { name: "🍁 楓葉狂暴之劍 🍁", attack: 15 };
            } else {
                item = { name: "⚡ 傳說之皇神光劍 ⚡", attack: 45 };
                addLog("<span style='color: #ff00ff;'><b>🌟 [全服公告] 幸運兒誕生！抽到了極稀有神兵！</b></span>");
            }

            player.inventory.push(item);
            addLog(`【轉蛋】恭喜獲得：<b>${item.name}</b> (ATK +${item.attack})`);
            
            updateInventory();
            updateUI();
        }

        // 更新背包畫面
        function updateInventory() {
            const invDiv = document.getElementById("inventory");
            if(player.inventory.length === 0) {
                invDiv.innerHTML = '<p style="color: #aaa;">背包空空如也...</p>';
                return;
            }

            let html = "";
            player.inventory.forEach((item, index) => {
                let isEquipped = player.weapon && player.weapon === item;
                html += `
                <div style="${isEquipped ? 'background: #fff3cd; border-color: #ffc107;' : ''}">
                    <strong>${item.name}</strong><br>
                    攻擊力 +${item.attack}<br>
                    ${isEquipped ? '<b style="color:green;">[已裝備]</b>' : `<button onclick="equipWeapon(${index})">裝備</button>`}
                </div>
                `;
            });
            invDiv.innerHTML = html;
        }

        // 裝備武器
        function equipWeapon(index) {
            player.weapon = player.inventory[index];
            addLog(`🗡️ 你裝備了 [${player.weapon.name}]，攻擊力大幅提升！`);
            updateUI();
            updateInventory(); // 刷新背包按鈕狀態
        }
    </script>
</body>
</html>
