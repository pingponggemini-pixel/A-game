<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maple RPG</title>
    <style>
        /* CSS 樣式區塊 */
        body {
            background: #f0f8ff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            background-color: #eee;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button:hover {
            background-color: #ddd;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-weight: bold;
        }

        #log {
            margin: 20px auto;
            border: 1px solid gray;
            height: 250px;
            width: 80%;
            max-width: 600px;
            overflow: auto;
            background: white;
            padding: 10px;
            text-align: left;
        }

        #inventory div {
            margin: 10px;
            padding: 10px;
            border: 1px dashed #aaa;
            display: inline-block;
            background: #fff;
        }
    </style>
</head>
<body>

    <div id="loginScreen">
        <h1>Maple RPG</h1>
        <input id="username" placeholder="輸入角色名稱">
        <button onclick="login()">開始冒險</button>
    </div>

    <div id="gameScreen" style="display:none">
        <h2 id="playerName"></h2>

        <div class="stats">
            <p>等級：<span id="level"></span></p>
            <p>HP：<span id="hp"></span></p>
            <p>攻擊：<span id="atk"></span></p>
            <p>金幣：<span id="gold"></span></p>
        </div>
        
        <button onclick="saveGame()">存檔</button>
        <button onclick="loadGame()">讀檔</button>

        <hr>

        <h3>地圖與轉蛋</h3>
        <button onclick="fight('菇菇寶貝')">菇菇森林</button>
        <button onclick="fight('綠水靈')">綠水靈森林</button>
        <button onclick="fight('藍寶王')">藍寶王巢穴</button>
        <button onclick="gacha()">裝備轉蛋 (20金幣)</button>

        <div id="log"></div>

        <hr>

        <h3>背包</h3>
        <div id="inventory"></div>
    </div>

    <script>
        // JavaScript 邏輯區塊
        let player = {
            name: "",
            level: 1,
            hp: 100,
            maxHp: 100,
            baseAttack: 10,
            gold: 0,
            exp: 0,
            inventory: [],
            weapon: null
        };

        const monsters = {
            "菇菇寶貝": { hp: 30, attack: 5, exp: 10, gold: 5 },
            "綠水靈": { hp: 50, attack: 8, exp: 20, gold: 10 },
            "藍寶王": { hp: 300, attack: 20, exp: 100, gold: 100 }
        };

        function login() {
            const username = document.getElementById("username").value;
            if(!username) return;

            player.name = username;
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("gameScreen").style.display = "block";
            updateUI();
        }

        function updateUI() {
            player.hp = Math.max(0, player.hp);

            document.getElementById("playerName").innerText = player.name;
            document.getElementById("level").innerText = player.level;
            document.getElementById("hp").innerText = player.hp + " / " + player.maxHp;
            document.getElementById("atk").innerText = getAttack(); 
            document.getElementById("gold").innerText = player.gold;
        }

        function addLog(text) {
            const logDiv = document.getElementById("log");
            logDiv.innerHTML += text + "<br>";
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function saveGame() {
            localStorage.setItem("mapleSave", JSON.stringify(player));
            addLog("【系統】存檔成功！");
        }

        function loadGame() {
            const savedData = localStorage.getItem("mapleSave");
            if (savedData) {
                player = JSON.parse(savedData);
                addLog("【系統】讀檔成功！歡迎回來，" + player.name);
                updateUI();
                updateInventory();
            } else {
                addLog("【系統】找不到存檔紀錄。");
            }
        }

        function getAttack() {
            let atk = player.baseAttack;
            if(player.weapon) {
                atk += player.weapon.attack;
            }
            return atk;
        }

        function fight(name) {
            let monster = JSON.parse(JSON.stringify(monsters[name]));
            let currentAtk = getAttack();

            addLog("=========== 戰鬥開始 ===========");
            addLog("遭遇野生 " + name + "！");

            while(player.hp > 0 && monster.hp > 0) {
                monster.hp -= currentAtk;
                addLog("你攻擊了 " + name + "，造成 " + currentAtk + " 點傷害");

                if(monster.hp <= 0) {
                    addLog("👉 " + name + " 被擊敗了！");
                    addLog("獲得 " + monster.gold + " 金幣與 " + monster.exp + " 經驗值");
                    
                    player.gold += monster.gold;
                    player.exp += monster.exp;
                    
                    levelCheck();
                    updateUI();
                    return;
                }

                player.hp -= monster.attack;
                addLog("⚠️ " + name + " 攻擊你，造成 " + monster.attack + " 點傷害");

                if(player.hp <= 0) {
                    addLog("☠️ 你被擊敗了...");
                    player.hp = player.maxHp;
                    updateUI();
                    return;
                }
            }
            updateUI();
        }

        function levelCheck() {
            if(player.exp >= 50) {
                player.exp -= 50;
                player.level++;
                player.maxHp += 20;
                player.hp = player.maxHp;
                player.baseAttack += 5;

                addLog("🌟 升級了！目前等級：Lv." + player.level);
            }
        }

        function gacha() {
            if(player.gold < 20) {
                addLog("❌ 金幣不足，需要 20 金幣");
                return;
            }

            player.gold -= 20;
            let r = Math.random();
            let item;

            if(r < 0.60) {
                item = { name: "木劍", attack: 1 };
            } else if(r < 0.90) {
                item = { name: "鋼鐵劍", attack: 3 };
            } else if(r < 0.99) {
                item = { name: "楓葉劍", attack: 7 };
            } else {
                item = { name: "傳說楓葉劍", attack: 20 };
                addLog("🎉 抽到大獎了！！");
            }

            player.inventory.push(item);
            addLog("🎁 轉蛋獲得： " + item.name + " (攻擊力 +" + item.attack + ")");
            
            updateInventory();
            updateUI();
        }

        function updateInventory() {
            let html = "";
            player.inventory.forEach((item, index) => {
                html += `
                <div>
                    <strong>${item.name}</strong><br>
                    ATK +${item.attack}<br>
                    <button onclick="equipWeapon(${index})">裝備</button>
                </div>
                `;
            });
            document.getElementById("inventory").innerHTML = html;
        }

        function equipWeapon(index) {
            player.weapon = player.inventory[index];
            addLog("🗡️ 裝備了 " + player.weapon.name);
            updateUI();
        }
    </script>
</body>
</html>
